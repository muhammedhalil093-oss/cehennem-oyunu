<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pixel Yeraltı: Kayıp Işık</title>
<style>
html,body{margin:0;background:#090b12;color:#eee;font-family:monospace;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;border:4px solid #eee;background:#101522;max-width:96vw;max-height:96vh}

body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#tc{display:none}
body.touch{flex-direction:column;justify-content:flex-start;padding-top:env(safe-area-inset-top)}
body.touch canvas{max-width:98vw;max-height:56vh;margin-top:6px}
@media (orientation:landscape){body.touch{justify-content:center;padding-top:0}body.touch canvas{max-height:94vh;margin-top:0}}
body.touch #tc{display:block}
#tc button{font-family:monospace;color:#eee;background:rgba(255,255,255,.12);border:2px solid #eee;border-radius:12px;font-size:20px;touch-action:none;padding:0}
#tc button.on{background:rgba(242,211,94,.55);color:#000}
#dpad{position:fixed;left:14px;bottom:calc(20px + env(safe-area-inset-bottom));display:grid;grid-template:repeat(3,58px)/repeat(3,58px);gap:4px}
#dpad .u{grid-area:1/2}#dpad .l{grid-area:2/1}#dpad .r{grid-area:2/3}#dpad .d{grid-area:3/2}
#dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(30px + env(safe-area-inset-bottom));display:none}
#dlg button{width:220px;height:70px;font-size:22px}
#bat{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));display:none;grid-template:repeat(2,64px)/repeat(2,min(44vw,170px));gap:8px}
#bat button{font-size:16px}
#shp{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));display:none;grid-template:64px/repeat(2,min(44vw,170px));gap:8px}
#shp button{font-size:16px}
body.tb #dpad{grid-template:repeat(3,48px)/repeat(3,48px);left:8px}
body.tb #bat{left:auto;right:8px;transform:none;grid-template:repeat(2,58px)/repeat(2,min(22vw,100px));gap:6px}
body.tb #bat button{font-size:11px}
#dpad,#dlg,#bat,#shp{z-index:5}

let dialogue=[];

function startDialog(){state="dialog";dialog=0;
 if(lights>=3)dialogue=kills==0?END[0]:kills<3?END[1]:END[2];
 else dialogue=lights==0?D0:MID[lights-1]}
function resetGame(){doorF=0;shards=[];lights=0;kills=0;mercy=0;ghostIdx=0;ghostAlive=true;ghostRespawn=0;hp=100;message="Tünelde yeni bir döngü başladı..."}
function after(){busy=true;if(enemyHP<=0)setTimeout(win,650);else setTimeout(()=>{if(ghostIdx===1&&hard)startDef();else{enemyAttack();busy=false}},500)}
function win(){busy=false;state="world";score+=100;lights++;kills++;shards.push(1);ghostIdx++;mercy=0;lightFx=90;sfx("bad");message="Hayalet kayboldu. +100 PUAN! +1 IŞIK ama tünel karardı.";enemyHP=24;ghostAlive=false;ghostRespawn=700;talkCooldown=30;saveProg();memo(ghostIdx-1,1)}
function spare(){busy=true;ghostShake=10;setTimeout(()=>{busy=false;state="world";score+=50;lights++;shards.push(0);lightFx=90;sfx("light");message="+1 IŞIK! "+G[ghostIdx].mem;ghostIdx++;mercy=0;enemyHP=24;ghostAlive=false;ghostRespawn=700;talkCooldown=30;saveProg();memo(ghostIdx-1,0)},700)}
function stopBar(){
 const d=Math.abs(bar.t),pf=hard?.04:.08;bar=null;let dmg=d<pf?14:Math.max(1,Math.round(12*(1-d)));
 if(focus){dmg=Math.round(dmg*1.5);focus=false}
 if(hard)dmg=Math.max(1,Math.round(dmg*.6));
 enemyHP=Math.max(0,enemyHP-dmg);score+=20;ghostShake=14;sfx(d<pf?"perfect":"hit");message=(d<pf?"MÜKEMMEL! ":"VURUŞ! ")+dmg+" hasar. +20 PUAN";after()
}
function battleKey(k){
 if(busy)return;
 if(bar){if(k==="1"||k==="a"||k===" "||k==="enter")stopBar();return}
 if(k==="1"||k==="a"){bar={t:-1};message="Çubuğu ortada durdur! (1 / A / ENTER / dokun)"}
 else if(k==="2"||k==="f"){focus=true;sfx("focus");message="Odaklandın. Bir sonraki saldırı güçlendi."}
 else if(k==="3"||k==="m"){mercy++;sfx("mercy");const g=G[Math.min(ghostIdx,2)];if(mercy>=3){message=g.m[2];enemyHP=0;spare()}else{message=g.m[mercy-1]+" ("+mercy+"/3)";ghostShake=8;busy=true;setTimeout(()=>{if(ghostIdx===1&&hard)startDef(true);else{enemyAttack(hard?10:5,true);busy=false}},500)}}
 else if(k==="4"||k==="r"){message="Kaçış yolu kapalı!"}
}
function shopKey(k){
 if(k==="1"||k==="e"){
  if(hp>=100)shopMsg="Slimey : Canın zaten dolu!";
  else if(score<50)shopMsg="Slimey : Yeterli puanın yok! (50 lazım)";
  else{score-=50;hp=100;sfx("shop");saveProg();shopMsg="Slimey : Al bakalım, canın fullendi! -50 puan"}
 }else if(k==="2"||k==="escape"||k==="enter"||k===" "){state="world";shopMsg="";shopCD=400;talkCooldown=30}
}

 hp=Math.max(0,hp-d);if(keep)message+=" (-"+d+" HP)";else message="Gölgeler sana çarptı! -"+d+" HP";hitFlash=8;ghostLunge=18;sfx("hurt");
 if(hp<=0){state="world";hp=100;mercy=0;px=320;py=350;message="Gözlerini açtığında girişteydin..."}
}

const D={
"Buraya kadar gelen ilk kişisin.":["Ты первый, кто дошёл сюда.","Eres el primero que llega hasta aquí."],
"Burası eskiden bir köydü. Işık kalbimizdi.":["Здесь была деревня. Свет был нашим сердцем.","Esto era una aldea. La luz era nuestro corazón."],
"Işık sönünce herkes hayalete dönüştü.":["Когда свет погас, все стали призраками.","Al apagarse la luz, todos se volvieron fantasmas."],
"Onlar sana zarar vermek istemiyor.":["Они не хотят причинить тебе вреда.","Ellos no quieren hacerte daño."],
"Işığı korumaya çalışıyorlar. Anlamıyorlar.":["Они защищают свет. Они не понимают.","Intentan proteger la luz. No lo entienden."],
"Üç ışık parçası bul. Nasıl, sana kalmış.":["Найди три частицы света. Как — решать тебе.","Encuentra tres fragmentos de luz. Cómo, tú decides."],
"Ben mi? Ben burada bir şeyi bekliyorum.":["Я? Я здесь кое-чего жду.","¿Yo? Yo espero algo aquí."],
"Beni duyan var mı?":["Есть кто-нибудь? Вы меня слышите?","¿Alguien me oye?"],
"Mavi ışık... Mara'nın umudu.":["Синий свет... надежда Мары.","Luz azul... la esperanza de Mara."],
"Mara... Hep umutluydu. Onu hatırlıyorum.":["Мара... Она всегда надеялась. Я помню её.","Mara... Siempre fue optimista. La recuerdo."],
"Devam et. Köy seni izliyor.":["Продолжай. Деревня смотрит на тебя.","Sigue adelante. La aldea te observa."],
"Kırmızı ışık... Toba'nın cesareti.":["Красный свет... смелость Тобы.","Luz roja... el valor de Toba."],
"Toba kardeşini aramak istedi. Ben engelledim.":["Тоба хотел искать брата. Я не пустил.","Toba quiso buscar a su hermano. Yo lo impedí."],
"Son ışık Ebe'de. O benim ustamdı.":["Последний свет у Эбе. Это мой наставник.","La última luz está con Ebe. Fue mi maestro."],
"Hepsine merhamet ettin...":["Ты пощадил всех...","Tuviste piedad de todos..."],
"Kapıyı ben tuttum. Işık o gün söndü.":["Дверь держал я. В тот день свет погас.","Yo sostuve la puerta. Ese día la luz se apagó."],
"Hepsini kurtaramadım. Yıllarca bekledim.":["Я не смог спасти всех. Я ждал годами.","No pude salvarlos a todos. Esperé años."],
"Ama bak, ışığı yaşatan hep onlardı.":["Но видишь, свет хранили именно они.","Pero mira, ellos mantuvieron viva la luz."],
"Işık geri dönüyor! Köy huzura erdi.":["Свет возвращается! Деревня обрела покой.","¡La luz vuelve! La aldea halló la paz."],
"Ben de artık dinlenebilirim. Sağ ol, yabancı.":["Теперь и я могу отдохнуть. Спасибо, странник.","Ahora yo también puedo descansar. Gracias, forastero."],
"*** SON: IŞIK GERİ DÖNDÜ ***":["*** КОНЕЦ: СВЕТ ВЕРНУЛСЯ ***","*** FINAL: LA LUZ VOLVIÓ ***"],
"Işığı topladın ama bazılarını sustururken...":["Ты собрал свет, но заставляя молчать некоторых...","Reuniste la luz, pero al silenciar a algunos..."],
"Kapıyı ben tuttum. Kendimi hiç affetmedim.":["Дверь держал я. Я так и не простил себя.","Yo sostuve la puerta. Nunca me perdoné."],
"Susturduğun hatıralar yok. Bu benim bedelim.":["Заглушённых воспоминаний нет. Такова моя цена.","Los recuerdos silenciados ya no están. Es mi precio."],
"Işık titrek yanıyor. Köy yarı huzurlu.":["Свет мерцает. Деревня обрела покой лишь наполовину.","La luz tiembla. La aldea está a medias en paz."],
"*** SON: SOLUK IŞIK ***":["*** КОНЕЦ: БЛЕДНЫЙ СВЕТ ***","*** FINAL: LUZ PÁLIDA ***"],
"Hepsini yendin. Işık artık sende.":["Ты победил всех. Свет теперь у тебя.","Los venciste a todos. La luz ya es tuya."],
"Kapıyı ben tuttum. Sen hepsini susturdun.":["Дверь держал я. А ты заставил всех замолчать.","Yo sostuve la puerta. Tú los silenciaste a todos."],
"Hatıraları dinlemedin. Kimse kalmadı.":["Ты не слушал воспоминания. Никого не осталось.","No escuchaste los recuerdos. No queda nadie."],
"Ama tünel sessiz. Yalnız kaldın.":["Но туннель молчит. Ты остался один.","Pero el túnel calla. Te quedaste solo."],
"*** SON: KARANLIK TAHT ***":["*** КОНЕЦ: ТРОН ТЬМЫ ***","*** FINAL: TRONO OSCURO ***"],
"Çökme sabahı herkes dışarı koştu.":["В то утро обвала все побежали наружу.","La mañana del derrumbe todos corrieron afuera."],
"Ben ışığı avucuma aldım, sönmesin diye.":["Я взяла свет в ладони, чтобы он не погас.","Tomé la luz en mis manos para que no se apagara."],
"Kapı kapandı. Bekçi tutuyordu onu.":["Дверь закрылась. Её держал Страж.","La puerta se cerró. El Guardián la sostenía."],
"Ona kızmadım. Sadece korktum.":["Я не злилась на него. Мне было просто страшно.","No me enojé con él. Solo tuve miedo."],
"Işık... avucumdaydı...":["Свет... был в моих ладонях...","La luz... estaba en mis manos..."],
"Kapı... Bekçi... kapıyı...":["Дверь... Страж... дверь...","La puerta... el Guardián... la puerta..."],
"(Mavi ışık sessizce soldu. Hatıra yarım kaldı.)":["(Синий свет тихо угас. Воспоминание оборвалось.)","(La luz azul se apagó en silencio. El recuerdo quedó incompleto.)"],
"Kardeşim kapının öbür tarafında kaldı.":["Мой брат остался по ту сторону двери.","Mi hermano quedó al otro lado de la puerta."],
"Geri dönüp onu almak istedim.":["Я хотел вернуться за ним.","Quise volver por él."],
"Bekçi tuttu beni: 'Kapı açılırsa hepsi gider.'":["Страж удержал меня: «Если открыть — все погибнут.»","El Guardián me detuvo: 'Si se abre, todos mueren.'"],
"Haklıydı belki. Ama yine de acıdı.":["Может, он был прав. Но всё равно было больно.","Quizá tenía razón. Pero dolió igual."],
"Kardeşim... kapı...":["Мой брат... дверь...","Mi hermano... la puerta..."],
"Beni tutan... kimdi...":["Кто... меня удержал...","Quién... me detuvo..."],
"(Kırmızı ışık titreyerek söndü. Hatıra yarım kaldı.)":["(Красный свет дрогнул и погас. Воспоминание оборвалось.)","(La luz roja tembló y se apagó. El recuerdo quedó incompleto.)"],
"Ben ışığın ilk bekçisiydim, Bekçi'nin ustası.":["Я был первым стражем света, наставником Стража.","Fui el primer guardián de la luz, el maestro del Guardián."],
"Çökmeyi önceden gördüm. Bekçi'ye söylemedim.":["Я предвидел обвал. Стражу не сказал.","Vi el derrumbe antes. No se lo dije al Guardián."],
"Korkutmak istemedim. Hata bendeydi, onda değil.":["Не хотел пугать. Вина на мне, не на нём.","No quise asustarlo. La culpa fue mía, no suya."],
"Ona söyle: kapıyı tutmakla doğru yaptı.":["Скажи ему: он правильно сделал, что держал дверь.","Dile: hizo bien en sostener la puerta."],
"Ben önceden gördüm...":["Я предвидел...","Yo lo vi antes..."],
"Ona söyleyemedim...":["Я не смог ему сказать...","No pude decírselo..."],
"(Sarı ışık usulca yok oldu. Hatıra yarım kaldı.)":["(Жёлтый свет тихо исчез. Воспоминание оборвалось.)","(La luz amarilla se desvaneció. El recuerdo quedó incompleto.)"],
"Işık... benim evimdi.":["Свет... был моим домом.","La luz... era mi hogar."],
"Sönmesin diye bekledim.":["Я ждала, чтобы он не погас.","Esperé para que no se apagara."],
"Beni... gördün mü?":["Ты... видишь меня?","¿Me... ves?"],
"Kardeşim nerede?":["Где мой брат?","¿Dónde está mi hermano?"],
"Karanlıkta kayboldu...":["Он пропал во тьме...","Se perdió en la oscuridad..."],
"Sen onu gördün mü?":["Ты его видел?","¿Lo viste?"],
"Işığı kimseye vermem.":["Свет я никому не отдам.","No entregaré la luz a nadie."],
"Bekçiydim ben...":["Я был стражем...","Yo era guardián..."],
"Sen... zararsızsın.":["Ты... не опасен.","Tú... eres inofensivo."],
"Mara önüne süzüldü: 'Beni duyan var mı?'":["Мара подплыла: «Кто-нибудь слышит меня?»","Mara flotó hacia ti: '¿Alguien me oye?'"],
"Toba gölgeden çıktı. Gözleri boş bakıyor.":["Тоба вышел из тени. Пустой взгляд.","Toba salió de la sombra. Su mirada está vacía."],
"Ebe tünelin ışığını kollayarak yaklaştı.":["Эбе подошёл, охраняя свет туннеля.","Ebe se acercó vigilando la luz del túnel."],
"Işığı avucumda sakladım... Sağ ol, huzurluyum.":["Я хранила свет в ладонях... Спасибо, я спокойна.","Guardé la luz en mis manos... Gracias, estoy en paz."],
"Kardeşimi aradım hep. Artık karanlık korkutmuyor.":["Я всё искал брата. Теперь тьма не пугает.","Siempre busqué a mi hermano. Ya no temo a la oscuridad."],

function tone(f,d,t,v,s,f2){const a=ac();if(!a||mute)return;try{const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+(s||0);o.type=t||"square";o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(v||.06,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d)}catch(e){}}
